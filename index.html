<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>itall</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #f4f4f5; --card: #fff; --ink: #0d0f14; --sub: #6b6f76; --line: #e4e4e7; --point: #f54741; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Pretendard, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 720px; margin: 0 auto; padding: 64px 16px 80px; }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
  .desc { margin-top: 8px; font-size: 15px; color: var(--sub); }
  ul { list-style: none; margin-top: 32px; display: grid; gap: 12px; }
  a.item {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px 24px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: inherit; text-decoration: none;
  }
  a.item:hover { border-color: var(--point); }
  .client { font-size: 13px; font-weight: 600; color: var(--point); }
  .name { margin-top: 4px; font-size: 18px; font-weight: 700; }
  .path { margin-top: 4px; font-size: 13px; color: var(--sub); }
  .arrow { flex: none; width: 20px; height: 20px; color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>itall</h1>
  <p class="desc">잇올 UX/UI팀 시안 공유 (내부용 · 검색 비노출)</p>
  <ul>
    <li>
      <a class="item" href="encom-school-project-2026-10/">
        <div>
          <p class="client">엔컴</p>
          <p class="name">10월 학교프로젝트 (제24회) 랜딩</p>
          <p class="path">/encom-school-project-2026-10/</p>
        </div>
        <svg class="arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </li>
    <li>
      <a class="item" href="sparta-jaesu-priority/">
        <div>
          <p class="client">스파르타</p>
          <p class="name">2028 재수우선선발반 — KV 영상 배경 소거</p>
          <p class="path">/sparta-jaesu-priority/</p>
        </div>
        <svg class="arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
