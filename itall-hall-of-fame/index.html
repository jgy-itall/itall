<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>KV 조명 애니메이션 테스트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    /*
      KV 조명 애니메이션 테스트 (PC 전용, 컨테이너 1280)
      레퍼런스: EBSi 2027 수능 D-100 이벤트 KV — 조명 스윙 + 반짝임
      - 소스는 2배수(2560 기준) → 화면에는 절반 크기
      - 조명: 빔 꼭짓점(조명 기구 위치)을 transform-origin으로 잡고 좌우 스윙 + 밝기 깜빡임
        LT/RT = 상단 좌/우, LB/RB = 하단 좌/우(Left/Right Bottom)
      - 반짝이: light_1 / light_2 교차 페이드
      - 위치·크기는 1280 기준 px → calc(N * var(--u))
    */
    *,
    *::before,
    *::after { box-sizing: border-box; }

    html, body { margin: 0; }

    :root {
      --u: calc(min(100vw, 1280px) / 1280);
      --beam-opacity: 1;
    }

    body {
      background: #111;
      color: #fff;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      word-break: keep-all;
    }

    /* ── 테스트 컨트롤 ── */
    .ctrl {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 24px;
      padding: 16px;
      background: #1c1c1c;
      font-size: 14px;
    }

    .ctrl label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .ctrl input[type="range"] { width: 120px; }
    .ctrl output { min-width: 32px; font-variant-numeric: tabular-nums; }

    /* ── KV ── */
    .kv {
      background: #0d0805;
      overflow: hidden;
    }

    .kv__inner {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 1280 / 747;
      margin: 0 auto;
      overflow: hidden;
    }

    .kv__bg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fx {
      position: absolute;
      display: block;
      max-width: none;
      mix-blend-mode: screen;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* ── 조명 빔 ── */
    .beam {
      z-index: 2;
      opacity: var(--beam-opacity);
      animation:
        var(--swing) var(--dur) ease-in-out var(--delay, 0s) infinite alternate,
        beam-flicker calc(var(--dur) * .7) ease-in-out var(--delay, 0s) infinite alternate;
    }

    /* 상단 좌 — 꼭짓점 = 좌상단 조명 기구 */
    .beam--lt {
      top: calc(40 * var(--u));
      left: calc(100 * var(--u));
      width: calc(555 * var(--u));
      transform-origin: 1% 1%;
      --swing: swing-lt; --dur: 5s;
    }

    /* 상단 우 */
    .beam--rt {
      top: calc(40 * var(--u));
      right: calc(100 * var(--u));
      width: calc(555 * var(--u));
      transform-origin: 99% 1%;
      --swing: swing-rt; --dur: 5.5s; --delay: -1.5s;
    }

    /* 하단 좌 — 꼭짓점 = 좌하단 */
    .beam--lb {
      bottom: calc(40 * var(--u));
      left: calc(60 * var(--u));
      width: calc(372 * var(--u));
      transform-origin: 0 100%;
      --swing: swing-lb; --dur: 4.5s; --delay: -1s;
    }

    /* 하단 우 */
    .beam--rb {
      bottom: calc(40 * var(--u));
      right: calc(60 * var(--u));
      width: calc(372 * var(--u));
      transform-origin: 100% 100%;
      --swing: swing-rb; --dur: 4s; --delay: -2.5s;
    }

    @keyframes swing-lt { from { transform: rotate(-6deg); } to { transform: rotate(5deg); } }
    @keyframes swing-rt { from { transform: rotate(6deg); }  to { transform: rotate(-5deg); } }
    @keyframes swing-lb { from { transform: rotate(8deg); }  to { transform: rotate(-6deg); } }
    @keyframes swing-rb { from { transform: rotate(-8deg); } to { transform: rotate(6deg); } }

    @keyframes beam-flicker {
      from { filter: brightness(1); }
      to   { filter: brightness(1.6); }
    }

    /* ── 반짝이 ── */
    .sparkle {
      z-index: 3;
      animation: twinkle var(--dur) ease-in-out var(--delay, 0s) infinite;
    }

    /* 위치: 시안 반짝임 좌표에 맞춤 (2배수 소스 기준 ÷2) */
    .sparkle--1 {
      top: calc(274 * var(--u));
      left: calc(350 * var(--u));
      width: calc(554 * var(--u));
      --dur: 3s;
    }

    .sparkle--2 {
      top: calc(216 * var(--u));
      left: calc(431 * var(--u));
      width: calc(560 * var(--u));
      --dur: 3s; --delay: -1.5s;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(.96); }
      50%      { opacity: 1; transform: scale(1); }
    }

    /* 컨트롤 토글 */
    .kv.no-beam .beam,
    .kv.no-sparkle .sparkle { display: none; }

    .kv.is-paused .fx { animation-play-state: paused; }

    @media (prefers-reduced-motion: reduce) {
      .fx { animation: none; }
    }
  </style>
</head>
<body>
  <div class="ctrl" role="group" aria-label="테스트 컨트롤">
    <label><input type="checkbox" id="tgBeam" aria-label="조명 빔" checked> 조명 빔</label>
    <label><input type="checkbox" id="tgSparkle" aria-label="반짝이" checked> 반짝이</label>
    <label><input type="checkbox" id="tgPause" aria-label="일시정지"> 일시정지</label>
    <label>빔 투명도 <input type="range" id="rgBeam" aria-label="빔 투명도" min="0" max="1" step=".05" value="1"> <output id="beamOut">1</output></label>
  </div>

  <main>
    <section class="kv" id="kv" aria-label="2027 명예의 전당">
      <div class="kv__inner">
        <img class="kv__bg" src="assets/kv_bg.webp" width="1280" height="747"
             alt="2027 명예의 전당 최대 2억원 규모 장학·합격 축하금. 여러분이 잇올의 자랑입니다. 치열했던 노력의 순간들, 그 끝에서 완성 합격. 잇올은 여러분의 1년을 기억합니다.">

        <img class="fx beam beam--lt" src="assets/spotlight_LT.webp" width="555" height="564" alt="" aria-hidden="true">
        <img class="fx beam beam--rt" src="assets/spotlight_RT.webp" width="555" height="564" alt="" aria-hidden="true">
        <img class="fx beam beam--lb" src="assets/spotlight_LB.webp" width="372" height="220" alt="" aria-hidden="true">
        <img class="fx beam beam--rb" src="assets/spotlight_RB.webp" width="372" height="220" alt="" aria-hidden="true">

        <img class="fx sparkle sparkle--1" src="assets/light_1.webp" width="554" height="189" alt="" aria-hidden="true">
        <img class="fx sparkle sparkle--2" src="assets/light_2.webp" width="560" height="283" alt="" aria-hidden="true">
      </div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';
      var kv = document.getElementById('kv');
      var root = document.documentElement;

      function bindToggle(id, cls, invert) {
        document.getElementById(id).addEventListener('change', function (e) {
          kv.classList.toggle(cls, invert ? !e.target.checked : e.target.checked);
        });
      }
      bindToggle('tgBeam', 'no-beam', true);
      bindToggle('tgSparkle', 'no-sparkle', true);
      bindToggle('tgPause', 'is-paused', false);

      var out = document.getElementById('beamOut');
      document.getElementById('rgBeam').addEventListener('input', function (e) {
        root.style.setProperty('--beam-opacity', e.target.value);
        out.textContent = e.target.value;
      });
    })();
  </script>
</body>
</html>
