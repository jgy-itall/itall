<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>itall</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 레퍼런스: Patrick Morgan, "How I make an aesthetic Figma thumbnail component that scales" (UX Collective)
     — 작업명 강조 · 상태 강조 · 진행/완료(라이트/다크) 구분 · Figma 파일 브라우저 같은 카드 */
  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --ink: #1b1b1b;
    --sub: #6b6f76;
    --line: #e6e6e6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Pretendard, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 56px 32px 96px; }

  /* 헤더 */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
  .head__title { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
  .head__desc { margin-top: 6px; font-size: 15px; color: var(--sub); }
  .head__count { font-size: 14px; color: var(--sub); white-space: nowrap; }
  .head__count b { color: var(--ink); font-weight: 700; }

  /* 브랜드 필터 탭 */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .tab {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    font: inherit; font-size: 14px; font-weight: 600; color: var(--sub); cursor: pointer;
  }
  .tab::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brand, var(--ink)); }
  .tab[data-group="all"]::before { display: none; }
  .tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tab__n { font-weight: 500; opacity: .6; }
  .empty { padding: 64px 0; text-align: center; color: var(--sub); font-size: 15px; }

  /* 그리드 — PC 3열 / 태블릿 2열 / 모바일 1열 */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) {
    .wrap { padding: 32px 16px 64px; }
    .head { flex-direction: column; align-items: flex-start; }
    .head__title { font-size: 26px; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
  }

  /* 카드 = 썸네일 + 파일 정보 (Figma 파일 브라우저 형태) */
  .card { display: block; border-radius: 12px; outline-offset: 4px; }
  .card[hidden] { display: none; }
  .card:focus-visible { outline: 2px solid var(--brand); }

  /* 썸네일 — 시안 비율 1600×960 (5:3) */
  .thumb {
    --pad: 7.5%;
    position: relative; aspect-ratio: 5 / 3; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: var(--pad); border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    container-type: inline-size;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover .thumb { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0, 0, 0, .08); }
  .card.is-done .thumb { background: #1e1e1e; border-color: #1e1e1e; color: #fff; }   /* 완료(비활성) = 다크 */

  .thumb__top { display: flex; align-items: center; justify-content: space-between; }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0.9cqw 2.4cqw; border-radius: 999px;
    font-size: 3.2cqw; font-weight: 600; line-height: 1.4;
    background: #eef7f1; color: #1d7a45;
  }
  .status::before { content: ""; width: 1.6cqw; height: 1.6cqw; border-radius: 50%; background: currentColor; }
  .status--review { background: #fff4e5; color: #b25e00; }
  .status--done { background: rgba(255, 255, 255, .12); color: rgba(255, 255, 255, .8); }
  .logo { font-size: 3.6cqw; font-weight: 800; letter-spacing: -0.02em; opacity: .22; }   /* 배경 대비 낮은 로고 */

  .thumb__body { display: flex; flex-direction: column; gap: 2.2cqw; }
  .bar { width: 9cqw; height: 0.9cqw; border-radius: 1cqw; background: var(--brand); }      /* <hr> 브랜드 컬러 */
  .thumb__name { font-size: 6.6cqw; font-weight: 800; line-height: 1.25; letter-spacing: -0.02em; word-break: keep-all; }
  .thumb__type { font-size: 3.2cqw; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--brand); }
  .card.is-done .thumb__type { color: rgba(255, 255, 255, .6); }
  .thumb__desc { font-size: 3.6cqw; line-height: 1.45; color: var(--sub); word-break: keep-all; }
  .card.is-done .thumb__desc { color: rgba(255, 255, 255, .6); }

  /* 썸네일 아래 파일 정보 */
  .meta { display: flex; align-items: center; gap: 12px; padding: 14px 4px 0; }
  .meta__badge {
    flex: none; width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--brand); color: #fff; font-size: 13px; font-weight: 800;
  }
  .meta__text { min-width: 0; }
  .meta__name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta__date { margin-top: 2px; font-size: 13px; color: var(--sub); }

</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <div>
      <h1 class="head__title">itall</h1>
      <p class="head__desc">잇올 UX/UI팀 시안 공유 (내부용 · 검색 비노출)</p>
    </div>
    <p class="head__count">시안 <b id="count">0</b>개</p>
  </header>

  <nav class="tabs" aria-label="브랜드 필터"></nav>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>해당 브랜드의 시안이 없습니다.</p>
  <noscript><p class="empty">JavaScript를 켜야 목록이 보입니다.</p></noscript>
</main>
<!-- ================================================================
     시안 목록 데이터 — 새 시안은 projects 배열에 한 덩어리만 추가
     · path    : 저장소 안 폴더명 (끝에 / 포함) — 목록이 하위 폴더에 있어 링크는 ../ 붙여 생성
     · brand   : brands 키 (새 브랜드면 brands에도 추가 — 이름·컬러·배지 글자)
                 탭은 sparta → 스파르타, dorm → 기숙, 그 외 모든 브랜드 → 기타
     · status  : "진행 중" | "검수" | "준비 중" | "완료"  (완료 = 다크 썸네일)
     · title   : 썸네일 큰 제목 — 줄 단위 배열 ["첫 줄", "둘째 줄"]
     · updated : 마지막 갱신일 YYYY-MM-DD (최신순 정렬 기준)
     ================================================================ -->
<script type="application/json" id="data">
{
  "brands": {
    "sparta": { "name": "스파르타", "color": "#d0121b", "badge": "S" },
    "dorm":   { "name": "기숙",     "color": "#009d78", "badge": "D" },
    "encom":  { "name": "엔컴",     "color": "#2f5bea", "badge": "E" },
    "itall":  { "name": "ITALL",    "color": "#e60f19", "badge": "I" }
  },
  "projects": [
    {
      "path": "itall-hall-of-fame/", "brand": "itall", "status": "진행 중",
      "title": ["명예의전당"], "type": "KV · Light Test", "desc": "스포트라이트 스윙 · 반짝이 · PC 1280",
      "label": "ITALL · 명예의전당", "updated": "2026-10-08"
    },
    {
      "path": "preview-05aecb8aed46/", "brand": "sparta", "status": "진행 중",
      "title": ["2028 통학", "재수우선선발반"], "type": "Landing", "desc": "랜딩 전체 퍼블리싱 · 반응형",
      "label": "스파르타 · 통학 재수우선선발반", "updated": "2026-10-08"
    },
    {
      "path": "preview-792e340707e0/", "brand": "dorm", "status": "진행 중",
      "title": ["2028 기숙", "재수우선선발반"], "type": "Landing · KV", "desc": "KV 영상 배경 소거 · 반응형",
      "label": "스파르타 · 기숙 재수우선선발반", "updated": "2026-10-08"
    },
    {
      "path": "encom-school-project-2026-10/", "brand": "encom", "status": "완료",
      "title": ["제24회", "학교프로젝트"], "type": "Landing", "desc": "엔컴 주관 · 10월 신청 안내",
      "label": "엔컴 · 10월 학교프로젝트", "updated": "2026-08-26"
    }
  ]
}
</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('data').textContent);
  var brands = data.brands;
  var list = data.projects.slice().sort(function (a, b) { return b.updated.localeCompare(a.updated); });
  var grid = document.getElementById('grid');
  var tabs = document.querySelector('.tabs');
  var STATUS = { '진행 중': '', '검수': ' status--review', '준비 중': ' status--review', '완료': ' status--done' };
  var TABS = [
    { key: 'sparta', name: '스파르타', color: brands.sparta.color },
    { key: 'dorm',   name: '기숙',     color: brands.dorm.color },
    { key: 'etc',    name: '기타',     color: '#97989a' }
  ];
  function group(p) { return p.brand === 'sparta' || p.brand === 'dorm' ? p.brand : 'etc'; }

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function card(p) {
    var b = brands[p.brand] || { name: p.brand, color: '#1b1b1b', badge: '?' };
    var done = p.status === '완료';
    return '<a class="card' + (done ? ' is-done' : '') + '" href="' + esc('../' + p.path) + '" data-group="' + group(p) + '" style="--brand:' + esc(b.color) + '">' +
      '<div class="thumb"><div class="thumb__top"><span class="status' + (STATUS[p.status] || '') + '">' + esc(p.status) + '</span><span class="logo">itall</span></div>' +
      '<div class="thumb__body"><span class="bar"></span><p class="thumb__name">' + [].concat(p.title).map(esc).join('<br>') + '</p>' +
      '<p class="thumb__type">' + esc(p.type) + '</p><p class="thumb__desc">' + esc(p.desc) + '</p></div></div>' +
      '<div class="meta"><span class="meta__badge" aria-hidden="true">' + esc(b.badge) + '</span><div class="meta__text">' +
      '<p class="meta__name">' + esc(p.label) + '</p><p class="meta__date">' + p.updated.replace(/-/g, '.') + ' 갱신</p></div></div></a>';
  }
  grid.innerHTML = list.map(card).join('');
  document.getElementById('count').textContent = list.length;

  /* 탭 — 전체 / 스파르타 / 기숙 / 기타 고정 (스파르타·기숙이 아닌 브랜드는 모두 '기타') */
  function tab(key, name, n, color) {
    return '<button class="tab" type="button" data-group="' + key + '" aria-pressed="' + (key === 'all') + '"' + (color ? ' style="--brand:' + color + '"' : '') + '>' + name + ' <span class="tab__n">' + n + '</span></button>';
  }
  function n(key) { return list.filter(function (p) { return group(p) === key; }).length; }
  tabs.innerHTML = tab('all', '전체', list.length) + TABS.filter(function (t) { return n(t.key) > 0; }).map(function (t) {
    return tab(t.key, t.name, n(t.key), t.color);
  }).join('');

  tabs.addEventListener('click', function (e) {
    var t = e.target.closest('.tab'); if (!t) return;
    var key = t.dataset.group, shown = 0;
    tabs.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-pressed', String(x === t)); });
    grid.querySelectorAll('.card').forEach(function (c) {
      var on = key === 'all' || c.dataset.group === key; c.hidden = !on; if (on) shown++;
    });
    document.getElementById('empty').hidden = shown > 0;
  });
})();
</script>
</body>
</html>
